[Unit]
After=tsinit.target persistent-files.service network-online.target network-files.service
Wants=network-online.target
# Wait until the HTTP-delivered ThinStation configuration is assembled.
Requires=network-files.service
ConditionPathIsMountPoint=/var/prstnt

[Service]
# Reads /etc/thinstation.network (HTTP) on every boot, with legacy fallback.
ExecStartPre=/usr/bin/thinstation-wazuh-configure
