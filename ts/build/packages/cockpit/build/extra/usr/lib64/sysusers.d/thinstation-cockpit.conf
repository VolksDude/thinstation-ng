u cockpit-ws 988 "User for cockpit web service" /nonexisting /bin/false
u cockpit-wsinstance 989 "User for cockpit-ws instances" /nonexisting /bin/false

# Do NOT declare cockpit-wsinstance-socket, cockpit-session-socket or
# cockpit-systemd-service here.  Cockpit's units create those names as systemd
# dynamic users (DynamicUser=yes); a static user or group with the same name
# makes cockpit-wsinstance-socket-user.service fail with "User or group with
# specified name already exists", which in turn keeps cockpit.service from
# starting.
